<html lang="en">

// Crop to a square, shrink to 256px and save as a small JPEG before uploading.
function fitImg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      for (const side of [900, 720, 560]) {
        const k = Math.min(1, side / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
        const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
        for (let q = 0.78; q >= 0.4; q -= 0.12) { const d = c.toDataURL("image/jpeg", q); if (d.length <= 150000) return res(d); }
      }
      rej(new Error("That picture is too large."));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file is not a picture.")); };
    img.src = url;
  });
}
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 256, c = document.createElement("canvas"); c.width = c.height = S;
      const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.getContext("2d").drawImage(img, sx, sy, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let q = 0.8, d = c.toDataURL("image/jpeg", q);
      while (d.length > 70000 && q > 0.3) { q -= 0.15; d = c.toDataURL("image/jpeg", q); }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file is not a picture.")); };
    img.src = url;
  });
}

// ---- Phone line indicator (Kenya). A guess from the first digits, display only. ----
function lineOf(cc, ph) {
  if (cc.replace(/\D/g, "") != "254") return "";
  let n = ph.replace(/\D/g, ""); if (n[0] == "0") n = n.slice(1);
  if (n.length < 3) return "";
  const p2 = +n.slice(0, 2), p3 = +n.slice(0, 3);
  if (n[0] == "1") return p3 >= 110 && p3 <= 115 ? "Safaricom" : p3 >= 100 && p3 <= 102 ? "Airtel" : "";
  if ([70, 71, 72, 79].includes(p2) || [740, 741, 742, 743, 745, 746, 748, 757, 758, 759, 768, 769].includes(p3)) return "Safaricom";
  if (p2 == 73 || p2 == 78 || (p3 >= 750 && p3 <= 756)) return "Airtel";
  if (p2 == 77) return "Telkom";
  return "";
}

    if (a == "reply" && x) { V.reply = x.view_once ? "View once message" : x.body.slice(0, 80); V.sel = null; upd(false); const i = $("msg"); if (i) i.focus(); return; }
    if (a == "react" && x) { V.sel = null; upd(false); await api("/messages/" + m + "/react", "POST", { emoji: x.reaction == b.dataset.e ? null : b.dataset.e }); return loadMsgs(false); }
    if (a == "copy" && x) { V.sel = null; upd(false); if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(x.body).then(() => toast("Copied"), () => toast("Copy is not available")); } else toast("Copy is not available"); return; }
    if (a == "menu") { V.menu = !V.menu; const mn = $("mn"); if (mn) mn.innerHTML = menuHtml(); return; }
    if (a == "pin" || a == "archive") {
      const c = CH.find((x) => x.peer == V.cid); if (!c) return;
      const on = a == "pin" ? !c.pinned : !c.archived;
      await api("/chats/" + V.cid + "/" + a, "POST", { value: on }); await loadCH(); V.menu = false;
      if (a == "archive" && on) { V.scr = null; render(); return toast("Chat archived"); }
      const mn = $("mn"); if (mn) mn.innerHTML = menuHtml();
      return toast(a == "pin" ? (on ? "Chat pinned" : "Chat unpinned") : "Chat unarchived");
    }
    if (a == "arch") { V.arch = !V.arch; return render(); }
    if (a == "once") { V.once = !V.once; b.classList.toggle("on", V.once); return; }
    if (a == "vo") { const j = await api("/messages/" + m + "/open", "POST"); V.vo = j.body; V.ov = "vo"; render(); return; }
    if (a == "cvo") { V.ov = null; V.vo = ""; render(); return loadMsgs(false); }
    if (a == "fwd" && x && !x.view_once) { V.fw = x.body; V.ov = "fwd"; V.sel = null; return render(); }
    if (a == "cfw") { V.ov = null; return render(); }
    if (a == "dofwd") { await api("/messages", "POST", { to: id, body: V.fw, fwd: true }); V.ov = null; render(); return toast("Message forwarded"); }
    if (a == "blk") {
      const was = BL.some((z) => z.id == V.cid);
      await api("/blocks/" + V.cid, was ? "DELETE" : "POST"); await loadBL(); V.menu = false;
      const mn = $("mn"); if (mn) mn.innerHTML = menuHtml();
      return toast(was ? "Unblocked" : "Blocked. They can’t see your status or last seen, and can’t reach you.");
    }
    if (a == "rep") { V.menu = false; V.ov = "rep"; return render(); }
    if (a == "sendrep") { await api("/reports", "POST", { user_id: V.cid, reason: $("rr").value, note: $("rn").value, singles: V.scr == "schat" || !!V.rpS }); V.rpS = false; V.ov = null; render(); return toast("Report sent. Thank you."); }
    if (a == "pg") { V.pg = b.dataset.p; V.ov = "pg"; if (V.pg == "dev") { try { DEVS = (await api("/sessions")).sessions; } catch (e) { DEVS = []; } } if (V.pg == "acct") { try { ACC = await api("/account"); U.trust = ACC.trust; } catch (e) { ACC = null; } } if (V.pg == "notif") { try { NOTIF = await api("/notifications"); PUSH = pushState(NOTIF); } catch (e) { NOTIF = null; PUSH = "off"; } } if (V.pg == "backup") { BKE = null; } if (V.pg == "edit") { EDT = { cover: U.cover || 0, mood: U.mood || "" }; } return render(); }
    if (a == "rmdev") { await api("/sessions/" + id, "DELETE"); DEVS = (await api("/sessions")).sessions; render(); return toast("Device logged out"); }
    if (a == "rmothers") { await api("/sessions/logout-others", "POST"); DEVS = (await api("/sessions")).sessions; render(); return toast("Other devices logged out"); }
    if (a == "accept") { if (!$("lg").checked) return toast("Please tick I agree"); try { localStorage.setItem("bv.agreed", "1"); } catch (e) {} V.ov = null; render(); return toast("Thank you. Terms accepted."); }
    if (a == "bls") { V.ov = "bls"; return render(); }
    if (a == "unbl") { await api("/blocks/" + id, "DELETE"); await loadBL(); return render(); }
    if (a == "delchat") { await api("/chats/" + V.cid, "DELETE"); await loadCH(); V.menu = false; V.scr = null; render(); return toast("Chat deleted"); }
    if (a == "addc") { const er = $("ce"), p = $("cp").value.trim(); if (p.replace(/\D/g, "").length < 9) { er.textContent = "Enter a valid phone number."; return; } try { await api("/contacts", "POST", { phone: p, alias: $("cn").value.trim() }); await loadCT(); await loadPhotos(CT.map((c) => c.id)); render(); toast("Contact added"); } catch (err) { er.textContent = err.message; const old = $("invb"); if (old) old.remove(); if (/not on Orivoclass/i.test(err.message)) er.insertAdjacentHTML("afterend", '<button class="btn o" id="invb" data-a="invite" data-p="' + esc(p) + '">Invite them to Orivoclass</button>'); } return; }
    if (a == "delc") { await api("/contacts/" + id, "DELETE"); await loadCT(); return render(); }
    if (a == "sc") { V.ov = "sc"; V.draft = ""; SIMG = ""; return render(); }
    if (a == "spick") { V.draft = $("stx") ? $("stx").value : V.draft; const f = $("sif"); if (f) f.click(); return; }
    if (a == "srmimg") { V.draft = $("stx") ? $("stx").value : V.draft; SIMG = ""; return render(); }
    if (a == "col") { V.draft = $("stx").value; V.col = b.dataset.c; return render(); }
    if (a == "post") { const t = $("stx").value.trim(); if (!t && !SIMG) return toast("Write something or add a photo first"); await api("/status", "POST", { body: t, color: V.col, image: SIMG || null }); SIMG = ""; await loadST(); V.ov = null; render(); return toast("Status posted"); }
    if (a == "vs") { V.ov = "view"; V.vid = id; const sx = ST.find((z) => z.id == id); if (sx && sx.user_id != U.id) api("/status/" + id + "/view", "POST").catch(() => {}); V.vimg = ""; render(); if (sx && sx.has_image) { try { V.vimg = (await api("/status/" + id + "/image")).image; } catch (e) { toast("Could not load the photo."); } if (V.ov == "view" && V.vid == id) render(); } return; }
    if (a == "cv") { V.ov = null; return render(); }
    if (a == "ds") { await api("/status/" + id, "DELETE"); await loadST(); return render(); }
    if (a == "savep") { const j = await api("/me", "PUT", { name: $("pn").value, about: $("pa").value, cover: EDT.cover, mood: EDT.mood }); U = j.user; V.ov = null; render(); return toast("Profile saved"); }
    if (a == "legal") { V.ov = "legal"; return render(); }
    if (a == "logout") { if (!V.lo) { V.lo = true; return render(); } return doLogout(); }
  } catch (err) { toast(err.message); }
});
app.addEventListener("input", (e) => {
  if (e.target.id == "ph" || e.target.id == "cc") showLine();
  if (e.target.id == "q") { V.q = e.target.value; const l = $("lst"); if (l) l.innerHTML = listHtml(); }
  else if (e.target.id == "msg" && V.scr == "chat" && Date.now() - lastTy > 3000) { lastTy = Date.now(); api("/typing/" + V.cid, "POST").catch(() => {}); }
});
app.addEventListener("change", async (e) => {
  if (e.target.id == "gs1" || e.target.id == "gs2") { try { await api("/groups/" + V.gid + "/settings", "PUT", { only_admins_send: $("gs1").checked, members_can_add: $("gs2").checked }); await loadGInfo(); render(); toast("Saved"); } catch (err) { toast(err.message); } return; }
  if (e.target.id == "sif" && e.target.files && e.target.files[0]) { try { SIMG = await fitImg(e.target.files[0]); render(); } catch (err) { toast(err.message); } return; }
  if (e.target.id == "sgf" && e.target.files && e.target.files[0]) { try { const d = await shrink(e.target.files[0]); await api("/singles/photo", "PUT", { photo: d }); SGP.photo = d; const el = $("sgav"); if (el) el.innerHTML = sgAvatar(SGP); toast("Photo saved"); } catch (err) { toast(err.message); } return; }
  if (e.target.id == "nfm" || e.target.id == "nfs" || e.target.id == "nfv" || e.target.id == "nfc") { try { await api("/notifications", "PUT", { msg: $("nfm").checked, status: $("nfs").checked, views: $("nfv").checked, calls: $("nfc").checked }); NOTIF = await api("/notifications"); toast("Saved"); } catch (err) { toast(err.message); } return; }
  if (e.target.id == "bkf" && e.target.files && e.target.files[0]) { try { const o = JSON.parse(await e.target.files[0].text()); if (o.type == "enc" && o.blob) { BKE = o; render(); return toast("Enter the backup password"); } if (o.type == "plain" && o.data && o.data.chats) { BK = o.data; BKI = null; V.ov = "bkv"; render(); return; } throw 0; } catch (err) { toast("That is not an Orivoclass backup."); } return; }
  if (e.target.id == "lpb" && lockOn()) { try { localStorage.setItem("bv.lk", JSON.stringify({ a: +e.target.value })); toast("Saved"); } catch (err) {} return; }
  if (e.target.id == "pf" && e.target.files && e.target.files[0]) { try { const d = await shrink(e.target.files[0]); await api("/me/photo", "PUT", { photo: d }); PH[U.id] = d; render(); toast("Photo saved"); } catch (err) { toast(err.message); } return; }
  if (e.target.id == "pp") { try { const j = await api("/me", "PUT", { name: U.name, about: U.about, photo_privacy: e.target.value }); U = j.user; toast("Saved"); } catch (err) { toast(err.message); } return; }
  if (e.target.id == "sp") { try { const j = await api("/me", "PUT", { name: U.name, about: U.about, seen_privacy: e.target.value }); U = j.user; toast("Saved"); } catch (err) { toast(err.message); } }
});
app.addEventListener("keydown", (e) => { if (e.key == "Enter" && e.target.id == "msg") { e.preventDefault(); V.scr == "gchat" ? sendG() : V.scr == "schat" ? sendS() : V.scr == "ai" ? sendAI() : send(); } if (e.key == "Enter" && e.target.id == "lpin") { e.preventDefault(); unlock(); } });
(async function init() {
  const jm = /^#join=([A-Za-z0-9_-]{16,40})$/.exec(location.hash);
  if (jm) { try { localStorage.setItem("bv.join", jm[1]); } catch (e) {} try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  if (!T && lockOn()) { V.scr = "lock"; render(); return; }
  if (T) { try { U = await api("/me"); await loadAll(); start(); } catch (e) { if (!T) U = null; } }
  render();
})();
