    put: async (k, v) => { const d = await db(); return new Promise((res, rej) => { const tx = d.transaction("k", "readwrite"); tx.objectStore("k").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },

// PIN-based sealing: PBKDF2 (200,000 rounds) then AES-GCM. The PIN never leaves this phone.
const KB = {
  async seal(pin, plain) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plain)));
    return JSON.stringify({ s: B64.enc(salt), i: B64.enc(iv), c: B64.enc(ct) });
  },
  async open(pin, blob) {
    const o = JSON.parse(blob);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: B64.dec(o.s), iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: B64.dec(o.i) }, key, B64.dec(o.c)));
  },
};
// Makes a backup of this phone's message key (a new key for this phone, so it can be exported).
async function backupKeys() {

  if (!pin) return;
  if (!/^\d{6}$/.test(pin)) return toast("Use exactly 6 digits.");
  if (!(await askConfirm("This makes a new message key for this phone. Old messages sent before this will not be readable on this phone. Continue?"))) return;
  const pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);

  const pub = await crypto.subtle.exportKey("jwk", pair.publicKey);
  const priv = await crypto.subtle.exportKey("pkcs8", pair.privateKey);
  const blob = await KB.seal(pin, JSON.stringify({ pkcs8: B64.enc(new Uint8Array(priv)), jwk: { kty: pub.kty, crv: pub.crv, x: pub.x, y: pub.y } }));

// ---- Security code: the same code on both phones means the chat is private ----
async function fingerprintFor(uid) {

  return keys.sort().join("|");
}
async function safetyCode(peerUid) {

const B64 = { enc: (u8) => btoa(String.fromCharCode(...u8)), dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
const PEERKEYS = new Map();

  } catch (err) { toast(err.message); }
});

(async function init() {
  const qp = new URLSearchParams(location.search);
  if (qp.get("act") || qp.get("peer") || qp.get("call")) { ACTQ = { act: qp.get("act") || "", call: qp.get("call") || "", peer: qp.get("peer") || "" }; try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.type == "action") runAct(e.data.p); });
  const jm = /^#join=([A-Za-z0-9_-]{16,40})$/.exec(location.hash);
  if (jm) { try { localStorage.setItem("bv.join", jm[1]); } catch (e) {} try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then((reg) => { setInterval(() => reg.update().catch(() => {}), 3600000); }).catch(() => {});
    navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.type == "updated" && !UPD) { UPD = true; drawUpd(); } });
  }
  checkUpdate();
  fetch(API + "/api/version").then((r) => r.json()).then((j) => { if (j.min_client > APP_VERSION) { V.scr = "update"; render(); } }).catch(() => {}); // in the background, nobody waits for it
  if (!T && lockOn()) { V.scr = "lock"; render(); return; }
  if (!T) { render(); return; }
  const c = loadCache();
  if (c) { U = c.U; CH = c.CH || []; CT = c.CT || []; GL = c.GL || []; ST = c.ST || []; BL = c.BL || []; render(); start(); }
  else { V.scr = "boot"; render(); }
  try { await bootLoad(); }
  catch (e) {
    if (!T) return; // logged out because the login ran out: logout() already showed the login screen
    if (!U) { V.scr = null; render(); toast("Cannot reach the server. Check your internet."); return; }
  }
  if (c) refreshMain(); else { if (V.scr == "boot") V.scr = null; render(); start(); }
  checkPayment();
  checkVerifyPay();
  if (ACTQ) { const q = ACTQ; ACTQ = null; runAct(q); }
})();
