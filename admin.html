<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orivoclass Admin</title>
<style>
:root{--bg:#F4F5F8;--card:#FFFFFF;--ink:#101828;--mu:#667085;--ln:#E4E7EC;--ac:#6247F5;--acs:#ECE9FE;--ok:#079455;--oks:#E6F6EE;--cr:#D92D20;--crs:#FDECEA;--wa:#B54708;--was:#FEF0C7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;color:var(--ac);margin-right:8px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:9px 14px;border-radius:10px;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
nav button.on{background:var(--acs);color:var(--ac)}
nav .n{background:var(--ln);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:12px}
nav button.on .n{background:var(--ac);color:#fff}
.spacer{flex:1}
main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:22px}
.head p{margin:4px 0 0;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.box h3{margin:0;font-size:15px}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--ln);color:var(--ink)}
.tag.red{background:var(--crs);color:var(--cr)}
.tag.green{background:var(--oks);color:var(--ok)}
.tag.amber{background:var(--was);color:var(--wa)}
.tag.blue{background:var(--acs);color:var(--ac)}
.muted{color:var(--mu);font-size:12.5px}
.quote{background:#F9FAFB;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}
.label{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
textarea,input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid #D0D5DD;border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:58px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
button.b{font:inherit;font-weight:600;border:1px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--ac);color:#fff}
button.b.sec{background:#fff;color:var(--ink);border-color:#D0D5DD}
button.b.ok{background:var(--ok);color:#fff}
button.b.warn{background:var(--wa);color:#fff}
button.b.danger{background:var(--cr);color:#fff}
button.b.ghost{background:none;color:var(--ac);border-color:var(--ln)}
button.b:disabled{opacity:.5;cursor:default}
.empty{background:var(--card);border:1px dashed #D0D5DD;border-radius:16px;padding:40px;text-align:center;color:var(--mu)}
.thumb{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#0B0B0F}
.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--was);color:var(--wa)}
.err{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--crs);color:var(--cr);display:none}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.plan{border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.plan h3{margin:0}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;color:var(--ac);font-size:22px}
pre{margin:0;background:#0B0B0F;color:#D0FFE0;border-radius:12px;padding:14px;overflow:auto;max-height:420px;font-size:12.5px}
.hide{display:none!important}
@media (max-width:640px){.grid{grid-template-columns:1fr}.bar{padding:12px}}
</style>
</head>
<body>

<div id="gate" class="login">
  <h1>Orivoclass Admin</h1>
  <span class="muted">Enter the admin key. It stays in this page only and is never saved.</span>
  <input id="key" type="password" placeholder="Admin key" autocomplete="off">
  <button class="b" id="enter">Open</button>
  <div class="err" id="gerr"></div>
</div>

<div id="app" class="hide">
  <header>
    <div class="bar">
      <span class="brand">Orivoclass Admin</span>
      <nav id="tabs"></nav>
      <span class="spacer"></span>
      <button class="b sec" id="refresh">Refresh</button>
    </div>
  </header>
  <main>
    <div id="view"></div>
    <div class="err" id="err"></div>
  </main>
</div>

<script>
const API = "https://orivoclass.onrender.com";
let KEY = "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fd = (x) => (x ? new Date(x).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "");
const TABS = [["reports", "Reports"], ["appeals", "Appeals"], ["posts", "Posts"], ["photos", "Singles photos"], ["plans", "Boost plans"], ["ai", "AI check"]];
let TAB = "reports", DATA = {};

async function call(path, method, body) {
  const r = await fetch(API + "/api/admin" + path, { method: method || "GET", headers: { "Content-Type": "application/json", "x-admin-key": KEY }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
function showErr(e) { const x = $("err"); x.textContent = e.message; x.style.display = "block"; setTimeout(() => (x.style.display = "none"), 6000); }
function setTabs() {
  const counts = { reports: (DATA.reports || []).length, appeals: (DATA.appeals || []).length, photos: (DATA.photos || []).length };
  $("tabs").innerHTML = TABS.map(([k, l]) => '<button data-t="' + k + '" class="' + (TAB === k ? "on" : "") + '">' + l + (counts[k] ? '<span class="n">' + counts[k] + "</span>" : "") + "</button>").join("");
  $("tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { TAB = b.dataset.t; render(); }));
}
async function loadAll() {
  const [r, a, p, po, bp] = await Promise.all([call("/reports"), call("/appeals"), call("/singles/photos"), call("/posts"), call("/boost-plans")]);
  DATA = { reports: r.reports, appeals: a.appeals, photos: p.photos, posts: po.posts, plans: bp.plans };
  render();
}
function render() {
  setTabs();
  const v = $("view");
  const map = { reports: viewReports, appeals: viewAppeals, posts: viewPosts, photos: viewPhotos, plans: viewPlans, ai: viewAI };
  v.innerHTML = map[TAB]();
  bind();
}
const head = (title, sub) => '<div class="head"><div><h1>' + title + "</h1>" + (sub ? "<p>" + sub + "</p>" : "") + "</div></div>";
const emptyBox = (t) => '<div class="empty">' + t + "</div>";

// ---------- Reports ----------
function viewReports() {
  const list = DATA.reports || [];
  let h = head("Reports", list.length + " open " + (list.length === 1 ? "report" : "reports") + ". Read the evidence, then choose one action.");
  if (!list.length) return h + emptyBox("No open reports. You are all caught up.");
  h += '<div class="grid">' + list.map((x) => `
    <div class="box" data-r="${x.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
        <div><h3>${esc(x.reported_name)}</h3><span class="muted">${esc(x.reported_phone)}</span></div>
        <div class="kv">${x.banned ? '<span class="tag red">Banned</span>' : ""}<span class="tag ${x.trust_score < 60 ? "amber" : "green"}">Trust ${x.trust_score}%</span></div>
      </div>
      <div class="kv"><span class="tag blue">${esc(x.reason)}</span><span class="tag">${x.total_reports} report(s)</span><span class="tag">${x.past_sanctions} earlier action(s)</span></div>
      ${x.note ? '<div><span class="label">Note from reporter</span><div>' + esc(x.note) + "</div></div>" : ""}
      <div><span class="label">Evidence</span>
        ${x.evidence && x.evidence.length ? '<div class="quote">' + x.evidence.map((e) => esc(e.body || (e.has_image ? "[photo]" : ""))).join("\n— ") + "</div>" : '<div class="muted">No message evidence.</div>'}
      </div>
      <span class="muted">Reported by ${esc(x.reporter_name)} (${esc(x.reporter_phone)}) · ${fd(x.created_at)}</span>
      <textarea rows="2" maxlength="300" placeholder="Message the user will see (optional)"></textarea>
      <div class="actions">
        <button class="b sec" data-act="dismiss">Dismiss</button>
        <button class="b" data-act="warning">Warning</button>
        <button class="b warn" data-act="restriction">Restrict 24h</button>
        <button class="b danger" data-act="rest3">Rest 3 days</button>
        <button class="b danger" data-act="rest7">Rest 7 days</button>
        <button class="b danger" data-act="ban">Permanent ban</button>
      </div>
    </div>`).join("") + "</div>";
  return h;
}
// ---------- Appeals ----------
function viewAppeals() {
  const list = DATA.appeals || [];
  let h = head("Appeals", list.length + " waiting for a decision");
  if (!list.length) return h + emptyBox("No appeals waiting.");
  h += '<div class="grid">' + list.map((x) => `
    <div class="box" data-a="${x.id}">
      <div><h3>${esc(x.name)}</h3><span class="muted">${esc(x.phone)} · trust ${x.trust_score}%</span></div>
      <div class="kv"><span class="tag amber">${esc(x.kind)}</span><span class="tag">${fd(x.appealed_at)}</span></div>
      <div><span class="label">Original reason</span><div>${esc(x.reason)}</div></div>
      <div><span class="label">Their appeal</span><div class="quote">${esc(x.appeal_text)}</div></div>
      <div class="actions"><button class="b ok" data-dec="accept">Accept and lift it</button><button class="b sec" data-dec="reject">Reject</button></div>
    </div>`).join("") + "</div>";
  return h;
}
// ---------- Posts ----------
function viewPosts() {
  const list = DATA.posts || [];
  let h = head("Posts", "The 30 latest posts. Open a post to see its picture, or remove it.");
  if (!list.length) return h + emptyBox("No posts yet.");
  h += '<div class="grid">' + list.map((x) => `
    <div class="box" data-p="${x.id}">
      <div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(x.name)}</h3><span class="muted">${fd(x.created_at)} · post #${x.id}</span></div>
        <div class="kv">${x.removed ? '<span class="tag red">Removed</span>' : '<span class="tag green">Live</span>'}${x.has_image ? '<span class="tag blue">Photo</span>' : ""}</div></div>
      <div class="quote" style="max-height:120px">${esc(x.body || (x.has_image ? "[photo only]" : "[no caption]"))}</div>
      <div data-view></div>
      <div class="actions"><button class="b sec" data-pview="${x.id}">Open</button>${x.removed ? "" : '<button class="b danger" data-premove="' + x.id + '">Remove post</button>'}</div>
    </div>`).join("") + "</div>";
  return h;
}
// ---------- Singles photos ----------
function viewPhotos() {
  const list = DATA.photos || [];
  let h = head("Singles photos", "New profile photos waiting for a check.");
  if (!list.length) return h + emptyBox("No photos to check.");
  h += '<div class="grid">' + list.map((x) => `
    <div class="box" data-p="${x.user_id}">
      <img class="thumb" alt="" src="${esc(x.photo)}">
      <div><h3>${esc(x.nick)}, ${x.age}</h3><span class="muted">Remove it if it shows nudity, violence, a minor, or someone else’s identity.</span></div>
      <div class="actions"><button class="b ok" data-ph="approve">Looks fine</button><button class="b warn" data-ph="remove">Remove photo</button><button class="b danger" data-ph="hide">Hide profile</button></div>
    </div>`).join("") + "</div>";
  return h;
}
// ---------- Boost plans ----------
function viewPlans() {
  const P = DATA.plans || {};
  let h = head("Boost plans", "What users pay for a boost. Changes apply to new boosts only.");
  h += '<div class="plans" id="plans">' + [1, 2, 3, 4, 5].map((d) => { const x = P[String(d)] || {}; return `
    <div class="plan" data-day="${d}">
      <h3>${d} day${d > 1 ? "s" : ""}</h3>
      <div class="label">Price (KSh)</div><input data-k="price" type="number" min="10" value="${x.price ?? ""}">
      <div class="label">Reach (people outside followers)</div><input data-k="reach" type="number" min="10" value="${x.reach ?? ""}">
      <div class="label">Repeat (hours before the same person sees it again)</div><input data-k="repeat" type="number" min="1" value="${x.repeat ?? ""}">
    </div>`; }).join("") + "</div>";
  h += '<div class="actions" style="margin-top:16px"><button class="b" id="psave">Save plans</button></div>';
  return h;
}
// ---------- AI ----------
function viewAI() {
  return head("AI check", "Sends a test message to the AI service and shows what it answers. The key is never shown.") +
    '<div class="box" style="max-width:720px"><div class="actions" style="margin:0"><button class="b" id="aitest">Run the test</button></div><pre id="aiout">Press “Run the test”.</pre></div>';
}

// ---------- actions ----------
function bind() {
  document.querySelectorAll("[data-act]").forEach((b) => (b.onclick = async () => {
    const box = b.closest("[data-r]"), act = b.dataset.act;
    const labels = { dismiss: "Dismiss this report?", warning: "Send a warning?", restriction: "Restrict this person for 24 hours?", rest3: "Rest this account for 3 days?", rest7: "Rest this account for 7 days?", ban: "Permanently ban this account? This cannot be undone." };
    if (!confirm(labels[act])) return;
    try { await call("/reports/" + box.dataset.r, "POST", { action: act, message: box.querySelector("textarea").value }); await loadAll(); } catch (e) { showErr(e); }
  }));
  document.querySelectorAll("[data-dec]").forEach((b) => (b.onclick = async () => {
    const box = b.closest("[data-a]");
    if (!confirm(b.dataset.dec === "accept" ? "Accept the appeal and lift the action?" : "Reject this appeal?")) return;
    try { await call("/appeals/" + box.dataset.a, "POST", { decision: b.dataset.dec }); await loadAll(); } catch (e) { showErr(e); }
  }));
  document.querySelectorAll("[data-pview]").forEach((b) => (b.onclick = async () => {
    const box = b.closest("[data-p]"), slot = box.querySelector("[data-view]");
    if (slot.innerHTML) { slot.innerHTML = ""; return; }
    try { const p = await call("/posts/" + b.dataset.pview); slot.innerHTML = (p.image ? '<img class="thumb" alt="" src="' + esc(p.image) + '">' : "") + '<div class="muted">Author ID: ' + esc(p.user_id) + "</div>"; } catch (e) { showErr(e); }
  }));
  document.querySelectorAll("[data-premove]").forEach((b) => (b.onclick = async () => {
    const why = prompt("Why is this post removed? The author will see this.", "Breaks our Community Rules"); if (why === null) return;
    const restrict = confirm("Also stop this person from posting for 24 hours?\n\nOK for nudity or other serious breaks.");
    try { await call("/posts/" + b.dataset.premove + "/remove", "POST", { reason: why, restrict }); await loadAll(); } catch (e) { showErr(e); }
  }));
  document.querySelectorAll("[data-ph]").forEach((b) => (b.onclick = async () => {
    const box = b.closest("[data-p]");
    if (b.dataset.ph !== "approve" && !confirm("Apply this to the photo or profile?")) return;
    try { await call("/singles/" + box.dataset.p, "POST", { action: b.dataset.ph }); await loadAll(); } catch (e) { showErr(e); }
  }));
  const ps = $("psave");
  if (ps) ps.onclick = async () => {
    const out = {};
    document.querySelectorAll("#plans .plan").forEach((c) => { const o = {}; c.querySelectorAll("input").forEach((i) => (o[i.dataset.k] = Number(i.value))); out[c.dataset.day] = o; });
    try { await call("/boost-plans", "PUT", { plans: out }); await loadAll(); alert("Saved. New boosts use these prices."); } catch (e) { showErr(e); }
  };
  const at = $("aitest");
  if (at) at.onclick = async () => {
    $("aiout").textContent = "Testing…";
    try { $("aiout").textContent = JSON.stringify(await call("/ai-test"), null, 2); } catch (e) { $("aiout").textContent = e.message; }
  };
}

// ---------- login ----------
async function open() {
  KEY = $("key").value.trim();
  try { await loadAll(); $("gate").classList.add("hide"); $("app").classList.remove("hide"); }
  catch (e) { KEY = ""; $("gerr").textContent = e.message; $("gerr").style.display = "block"; }
}
$("enter").onclick = open;
$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
$("refresh").onclick = () => loadAll().catch(showErr);
</script>
</body>
</html>
